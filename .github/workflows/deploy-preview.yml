name: Deploy preview

# CD: a push to `dev` runs the gate and, on success, deploys a preview. `release.mjs run`
# gates before it deploys, so a failing test stops the deploy. Runs on GitHub's runners;
# agents only merge + push.

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: gate + deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install pinned tooling
        run: npm ci

      # `run` (no --dry-run) gates, deploys the preview, verifies the alias, prunes.
      # It exits non-zero on any failure, which stops this job.
      - name: Gate and deploy preview
        run: node tools/release/release.mjs run